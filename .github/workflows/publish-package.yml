name: Publish to GitHub Packages (Maven)

on:
  workflow_run:
    workflows: ["CI / Build & Release"]
    types:
      - completed
  workflow_dispatch:

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check whether the version is already published
        id: check
        run: |
          VERSION=$(grep -E '^version=' gradle.properties | head -n 1 | cut -d'=' -f2 | tr -d '[:space:]')
          URL="https://maven.pkg.github.com/${GITHUB_REPOSITORY}/org/example/todo-app/${VERSION}/todo-app-${VERSION}.pom"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" "$URL")
          echo "Version ${VERSION} -> Maven answered ${CODE}"
          if [ "$CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.check.outputs.exists != 'true'
        run: ./gradlew --no-daemon publish

      - name: Skip notice
        if: steps.check.outputs.exists == 'true'
        run: echo "Version is already published, nothing to upload."

      - name: Make package public
        if: steps.check.outputs.exists != 'true'
        run: |
          gh api --method PATCH "/users/${GITHUB_REPOSITORY_OWNER}/packages/maven/todo-app/visibility" \
            -f visibility=public || true
